version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: abogadobot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    ports: ["3000:3000"]
    env_file: ./backend/.env
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    environment:
      VITE_API_URL: http://localhost:3000
volumes:
  pgdata:
